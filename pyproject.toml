[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segi-freshwatch"
dynamic = ["version"]
description = "On-device AI produce freshness monitoring for wet markets (NVIDIA Jetson, CUDA, TensorRT)"
readme = "README.md"
requires-python = ">=3.10"
# TensorRT, OpenCV (with GStreamer) and the CUDA runtime come from JetPack system packages.
dependencies = [
    "numpy>=1.24,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "pyyaml>=6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = ["pyarrow>=14", "onnx>=1.15", "pillow>=9"]  # + torch/torchvision from the Jetson AI Lab index
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
freshwatch = "freshwatch.__main__:main"

[tool.setuptools]
packages = ["freshwatch"]

[tool.setuptools.dynamic]
version = { attr = "freshwatch.__version__" }

[tool.setuptools.package-data]
freshwatch = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
