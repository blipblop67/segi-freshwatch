# Customer showcase: one dashboard with
#   * a simulated 90 s decay scenario (tools/make_demo_video.py, held-out test photos), and
#   * four real market clips (free Pexels footage, data/real/SOURCES.md).
# Run: make showcase   (http://<jetson-ip>:8080)
#
# Calibration notes for the real clips:
#   T3 (red apples, dim wide shot) runs on colour analysis only: the current model is not yet
#   reliable on that view (scored fresh apples ~50%). Re-enable after fine-tuning on site footage.
#   The 40 px banana zone of the indoor market was dropped: zones under ~64 px are too small.
site: {store_id: segi-wm-pilot, name: "SEGI Cash & Carry \xB7 Wet Market"}
model: {engine: models/freshness_fp16.engine, labels: models/labels.json}
scoring: {hysteresis_readings: 3}
alerts: {cooldown_s: 60}
storage: {db_path: data/showcase/freshwatch.db, persist_interval_s: 5, snapshot_dir: data/showcase/snapshots}
cameras:
- id: aisle3-sim
  name: "Aisle 3 \xB7 Fruit display"
